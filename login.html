<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="theme.js?v=20261114a"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
  <script src="auth-guard.js?v=20261114a"></script>
  <title>TriSeason — Connexion</title>
  <link rel="stylesheet" href="style.css?v=20261114a">
  <style>
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .auth-box {
      width: 100%; max-width: 380px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r);
      padding: 32px 28px;
    }
    .auth-logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 24px; }
    .auth-logo__icon { height: 18px; }
    .auth-logo__icon::before, .auth-logo__icon::after, .auth-logo__icon > i { width: 4px; }
    .auth-logo__icon::before { height: 10px; } .auth-logo__icon > i { height: 18px; } .auth-logo__icon::after { height: 14px; }
    .auth-logo__text { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
    .auth-pitch { font-size: 13px; line-height: 1.55; color: var(--text-2); text-align: center; margin: -8px 0 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    .auth-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 4px; }
    .auth-sub { font-size: 12px; color: var(--text-2); text-align: center; margin-bottom: 22px; }
    .auth-error {
      display: none; background: rgba(239,83,80,.1); border: 1px solid rgba(239,83,80,.3);
      color: var(--red); font-size: 12px; padding: 9px 12px; border-radius: var(--r-sm);
      margin-bottom: 14px; line-height: 1.5;
    }
    .auth-divider {
      display: flex; align-items: center; gap: 10px; margin: 18px 0;
      font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em;
    }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .btn--google {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #1f1f1f; border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 10px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .btn--google:hover { opacity: .9; }
    .auth-switch { text-align: center; font-size: 13px; color: var(--text-2); margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
    .auth-switch .btn.btn--ghost { width: 100%; justify-content: center; margin-top: 8px; padding: 11px 14px; font-size: 15px; font-weight: 600; color: var(--text); border-color: var(--text-3); }
    .auth-info {
      display: none; background: var(--green-dim); border: 1px solid rgba(52,196,139,.35);
      color: var(--text); font-size: 12px; padding: 9px 12px; border-radius: var(--r-sm);
      margin-bottom: 14px; line-height: 1.5;
    }
    .auth-forgot { text-align: right; margin-top: -4px; margin-bottom: 4px; }
    .auth-forgot a, .auth-legal a { color: var(--text-2); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .auth-consent {
      display: none; gap: 9px; align-items: flex-start; font-size: 12px; color: var(--text-2);
      line-height: 1.5; margin: 6px 0 4px; cursor: pointer;
    }
    .auth-consent input { margin-top: 2px; accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; }
    .auth-consent a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .auth-legal { text-align: center; margin-top: 14px; }
  </style>
</head>
<body>

  <div class="auth-box">
    <div class="auth-logo">
      <span class="nav__logo-icon auth-logo__icon" aria-hidden="true"><i></i></span>
      <div class="auth-logo__text">TriSeason</div>
    </div>
    <p class="auth-pitch">Strava et Garmin suivent tes séances. TriSeason les relie à ce que tu manges et à ta forme, pour voir ce qui te fait progresser.</p>

    <div class="auth-title" id="authTitle">Connexion</div>
    <div class="auth-sub" id="authSub">Accède à ton suivi de saison</div>

    <div class="auth-error" id="authError"></div>
    <div class="auth-info" id="authInfo"></div>

    <label class="auth-consent" id="authConsent">
      <input type="checkbox" id="authConsentCheck">
      <span>J'accepte que TriSeason enregistre et utilise mes données de santé (poids, fréquence cardiaque, nutrition…) pour me fournir mon suivi. <a href="confidentialite.html" target="_blank" rel="noopener">Politique de confidentialité</a></span>
    </label>

    <button class="btn--google" onclick="signInGoogle()">
      <svg width="17" height="17" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.8 2.73v2.27h2.92c1.71-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.29-1.11-.29-1.71s.11-1.17.29-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continuer avec Google
    </button>

    <div class="auth-divider">ou</div>

    <form id="authForm" onsubmit="return false">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="authEmail" placeholder="toi@exemple.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="pw-field"><input class="form-input" type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" required><button type="button" class="pw-eye" aria-label="Afficher le mot de passe" aria-pressed="false" onclick="const i=this.previousElementSibling,v=i.type==='password';i.type=v?'text':'password';this.setAttribute('aria-pressed',v);this.setAttribute('aria-label',v?'Cacher le mot de passe':'Afficher le mot de passe')"><svg class="pw-eye__show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="pw-eye__hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button></div>
      </div>
      <div class="auth-forgot" id="authForgot"><a onclick="resetPassword()">Mot de passe oublié ?</a></div>
      <button class="btn btn--primary" style="width:100%;margin-top:6px;justify-content:center" onclick="submitEmailAuth()" id="authSubmitBtn">Se connecter</button>
    </form>

    <div class="auth-switch" id="authSwitch">
      Pas encore de compte ?
      <button type="button" class="btn btn--ghost" onclick="toggleMode()">Créer un compte</button>
    </div>
    <div class="auth-legal"><a href="aide.html?depuis=login.html">Besoin d’aide ?</a> · <a href="confidentialite.html">Confidentialité et mentions légales</a></div>
  </div>

<script>
let mode = 'signin'; // 'signin' | 'signup'
if (window.firebase && firebase.auth) firebase.auth().languageCode = 'fr'; // e-mails Firebase en français

if (new URLSearchParams(location.search).get('deleted') === '1') {
  showInfo('Ton compte et toutes tes données ont été supprimés.');
}

function toggleMode() {
  mode = mode === 'signin' ? 'signup' : 'signin';
  const isSignup = mode === 'signup';
  document.getElementById('authTitle').textContent = isSignup ? 'Créer un compte' : 'Connexion';
  document.getElementById('authSub').textContent = isSignup ? 'Rejoins TriSeason en quelques secondes' : 'Accède à ton suivi de saison';
  document.getElementById('authSubmitBtn').textContent = isSignup ? 'Créer mon compte' : 'Se connecter';
  document.getElementById('authForm').querySelector('input[type=password]').autocomplete = isSignup ? 'new-password' : 'current-password';
  document.getElementById('authConsent').style.display = isSignup ? 'flex' : 'none';
  document.getElementById('authForgot').style.display = isSignup ? 'none' : 'block';
  document.getElementById('authSwitch').innerHTML = isSignup
    ? 'Déjà un compte ? <button type="button" class="btn btn--ghost" onclick="toggleMode()">Se connecter</button>'
    : 'Pas encore de compte ? <button type="button" class="btn btn--ghost" onclick="toggleMode()">Créer un compte</button>';
  hideError();
  hideInfo();
}

function showInfo(msg) {
  const el = document.getElementById('authInfo');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideInfo() {
  document.getElementById('authInfo').style.display = 'none';
}

// À l'inscription, la case doit être cochée. L'accord est enregistré dans le
// compte juste après sa création (voir checkConsent dans app.js).
function consentOk() {
  if (mode !== 'signup') return true;
  if (!document.getElementById('authConsentCheck').checked) {
    showError('Pour créer un compte, coche la case d’accord sur l’utilisation de tes données.');
    return false;
  }
  try { localStorage.setItem('triseason_pending_consent', String(Date.now())); } catch (e) {}
  return true;
}

// Mot de passe oublié : Firebase envoie un e-mail avec un lien de
// réinitialisation. Message identique que le compte existe ou non, pour ne pas
// révéler quelles adresses sont inscrites.
function resetPassword() {
  hideError(); hideInfo();
  const email = document.getElementById('authEmail').value.trim();
  if (!email) {
    showError('Saisis ton adresse e-mail ci-dessus, puis clique à nouveau sur « Mot de passe oublié ? ».');
    document.getElementById('authEmail').focus();
    return;
  }
  firebase.auth().sendPasswordResetEmail(email)
    .then(() => showInfo('Si un compte existe pour ' + email + ', un e-mail pour choisir un nouveau mot de passe vient d’être envoyé. Pense à regarder dans les spams.'))
    .catch(err => {
      if (err.code === 'auth/user-not-found') {
        showInfo('Si un compte existe pour ' + email + ', un e-mail pour choisir un nouveau mot de passe vient d’être envoyé. Pense à regarder dans les spams.');
      } else {
        showError(friendlyError(err));
      }
    });
}

function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('authError').style.display = 'none';
}

function friendlyError(err) {
  const map = {
    'auth/invalid-email':            'Adresse email invalide.',
    'auth/user-not-found':           'Aucun compte ne correspond à cet email.',
    'auth/wrong-password':           'Mot de passe incorrect.',
    'auth/invalid-credential':       'Email ou mot de passe incorrect.',
    'auth/email-already-in-use':     'Un compte existe déjà avec cet email.',
    'auth/weak-password':            'Le mot de passe doit faire au moins 6 caractères.',
    'auth/too-many-requests':        'Trop de tentatives — réessaie dans quelques minutes.',
    'auth/popup-closed-by-user':     'Fenêtre Google fermée avant la fin de connexion.',
    'auth/network-request-failed':   'Problème de connexion internet.',
    'auth/missing-email':            'Saisis ton adresse e-mail.',
  };
  return map[err.code] || ('Une erreur est survenue (' + (err.code || err.message) + ').');
}

function submitEmailAuth() {
  hideError();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { showError('Renseigne un email et un mot de passe.'); return; }
  if (!consentOk()) return;

  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true;
  btn.textContent = mode === 'signup' ? 'Création…' : 'Connexion…';

  const action = mode === 'signup'
    ? firebase.auth().createUserWithEmailAndPassword(email, password)
    : firebase.auth().signInWithEmailAndPassword(email, password);

  action
    .then(() => { /* auth-guard.js gère la redirection */ })
    .catch(err => {
      try { localStorage.removeItem('triseason_pending_consent'); } catch (e) {}
      showError(friendlyError(err));
      btn.disabled = false;
      btn.textContent = mode === 'signup' ? 'Créer mon compte' : 'Se connecter';
    });
}

function signInGoogle() {
  hideError();
  if (!consentOk()) return;
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider)
    .then(() => { /* auth-guard.js gère la redirection */ })
    .catch(err => {
      try { localStorage.removeItem('triseason_pending_consent'); } catch (e) {}
      if (err.code !== 'auth/popup-closed-by-user') showError(friendlyError(err));
    });
}

// Valider avec la touche Entrée
document.getElementById('authForm').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitEmailAuth();
});
</script>
</body>
</html>
