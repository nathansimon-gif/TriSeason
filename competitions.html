<div class="page"><div class="container">

</div></div>

<!-- ── Competition modal ── -->
<div class="modal-overlay" id="compModal">
  <div class="modal" style="max-width:560px">
    <div class="modal__header">
      <div class="modal__title" id="compModalTitle">Nouvelle course</div>
      <button class="modal__close" onclick="closeModal()">×</button>
    </div>
    <div class="stack">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input class="form-input" type="date" id="c_date">
        </div>
        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-select" id="c_type">
            <option value="TRI">Triathlon</option>
            <option value="RUN">Course à pied</option>
            <option value="BIKE">Cyclisme</option>
            <option value="NAT">Natation</option>
            <option value="DUATH">Duathlon</option>
            <option value="AQUA">Aquathlon</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Nom de la course</label>
        <input class="form-input" type="text" id="c_name" placeholder="ex: Ironman Nice, 10km de Rennes...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Distance (km)</label>
          <input class="form-input" type="number" step="0.1" id="c_dist" placeholder="">
        </div>
        <div class="form-group">
          <label class="form-label">Priorité</label>
          <select class="form-select" id="c_priority">

      </div>

      <div class="form-row">

          <label class="form-label" data-tip="Format : HH:MM:SS ou HH:MM">Objectif de temps</label>

        </div>
        <div class="form-group">
          <label class="form-label" data-tip="Remplir après la course">Temps réalisé</label>
          <input class="form-input" type="text" id="c_actual" placeholder="ex: 4:22:15">
        </div>
      </div>
      <div id="c_calc" style="font-size:12px;color:var(--text-2);font-family:var(--mono);padding:8px;background:var(--surface2);border-radius:var(--radius-sm);min-height:32px"></div>
      <div class="form-group">

<script src="app.js"></script>
<script>
let editId = null;
let currentFilter = 'all';
let charts = {};
Chart.defaults.animation = false;
Chart.defaults.responsive = true;
Chart.defaults.maintainAspectRatio = false;

function makeChart(id, config) {
  if (charts[id]) { charts[id].destroy(); charts[id] = null; }
  const canvas = document.getElementById(id);
  if (!canvas) return null;
  canvas.style.display = 'block';
  const chart = new Chart(canvas, config);
  charts[id] = chart;
  return chart;
}


document.addEventListener('DOMContentLoaded', () => {
  renderAll();
  TS.initTooltips();
  // Update calc on input
  ['c_goal','c_actual','c_dist','c_type'].forEach(id =>
    document.getElementById(id)?.addEventListener('input', updateCompCalc)
  );
});

window.addEventListener('triseason:update', renderAll);

function renderAll() {
  renderKPIs();
  renderCharts();
  renderList();
}

// ── KPIs ──────────────────────────────────────────────────────────────────────
function renderKPIs() {
  const comps = TS.getCompetitions();
  const today = new Date().toISOString().split('T')[0];
  const done     = comps.filter(c => c.actual_time);
  const upcoming = comps.filter(c => c.date >= today && !c.actual_time);
  const goalOk   = done.filter(c => c.goal_time && timeToSec(c.actual_time) <= timeToSec(c.goal_time));
  const pct      = done.length ? Math.round(goalOk.length/done.length*100) : 0;
  const next     = upcoming[0];
  const daysLeft = next ? Math.ceil((new Date(next.date)-new Date())/86400000) : null;

  document.getElementById('compKPIs').innerHTML = `
    <div class="kpi"><div class="kpi__value">${comps.length}</div><div class="kpi__label">Courses planifiées</div></div>
    <div class="kpi"><div class="kpi__value">${done.length}</div><div class="kpi__label">Réalisées</div></div>
    <div class="kpi" style="border-top:2px solid var(--green)"><div class="kpi__value" style="color:var(--green)">${goalOk.length}</div><div class="kpi__label">Objectifs atteints</div></div>
    <div class="kpi"><div class="kpi__value">${done.length?pct+'%':'—'}</div><div class="kpi__label">Taux de réussite</div></div>
    <div class="kpi" style="border-top:2px solid var(--accent)"><div class="kpi__value" style="color:var(--accent-light)">${daysLeft!==null?'J-'+daysLeft:'—'}</div><div class="kpi__label">${next?next.name:'Prochaine course'}</div></div>
  `;
}

// ── Charts ────────────────────────────────────────────────────────────────────
function renderCharts() {
  const comps = TS.getCompetitions().filter(c => c.actual_time && c.goal_time);
  if (comps.length) {
    const labels = comps.map(c => c.name.length > 14 ? c.name.slice(0,14)+'…' : c.name);
    charts['chartResults'] = makeChart('chartResults', {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label:'Objectif', data: comps.map(c=>timeToSec(c.goal_time)/60), backgroundColor:'rgba(99,102,241,0.5)', borderRadius:4 },
          { label:'Réalisé',  data: comps.map(c=>timeToSec(c.actual_time)/60),
            backgroundColor: comps.map(c=>timeToSec(c.actual_time)<=timeToSec(c.goal_time)?'rgba(34,197,94,0.7)':'rgba(239,68,68,0.7)'), borderRadius:4 },
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#94a3b8', font:{size:11} } }, tooltip:{ callbacks:{ label: ctx => secToTime(ctx.raw*60) } } },
        scales:{ x:{grid:{display:false},ticks:{color:'#475569',font:{size:10}}}, y:{grid:{color:'#1e2d47'},ticks:{color:'#475569',font:{size:10},callback:v=>secToTime(v*60)}} }
      }
    });
  }

  const allComps = TS.getCompetitions();
  const byType = {};
  for (const c of allComps) { byType[c.type] = (byType[c.type]||0) + 1; }
  if (Object.keys(byType).length) {
    charts['chartTypes'] = makeChart('chartTypes', {
      type: 'doughnut',
      data: {
        labels: Object.keys(byType),
        datasets: [{ data: Object.values(byType), backgroundColor:['#6366f1','#E76F51','#F4A261','#0D7377','#a855f7','#22c55e'], borderWidth:0 }]
      },
      options: {
        responsive:true, maintainAspectRatio:false, cutout:'65%',
        plugins:{ legend:{ position:'bottom', labels:{ color:'#94a3b8',font:{size:11},boxWidth:10 } } }
      }
    });
  }
}

// ── List ──────────────────────────────────────────────────────────────────────
function filterComps(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderCompPrep(c) {
  var data     = TS.getData();
  var nutri    = data.nutrition || {};
  var allMeals = nutri.meals    || [];
  var allHydro = nutri.hydration || {};

  // Séances explicitement associées à cette course
  var linked = TS.getSessions().filter(function(s){ return s.comp_id === c.id; });

  // Séances dans les 7 jours avant la course (non associées)
  var raceDate = new Date(c.date + 'T00:00:00');
  var nearby   = TS.getSessions().filter(function(s){
    if (s.comp_id) return false;
    var sd = new Date(s.date + 'T00:00:00');
    var diff = (raceDate - sd) / 86400000;
    return diff >= 1 && diff <= 7;
  });

  var prep = linked.concat(nearby);
  if (!prep.length) return '';

  // Résumé nutrition J-7
  var days7 = {};
  prep.forEach(function(s){ days7[s.date] = true; });
  var dayKeys   = Object.keys(days7);
  var totalH    = allHydro;
  var avgHydro  = 0, avgKcal = 0, count = 0;
  dayKeys.forEach(function(d){
    avgHydro += (allHydro[d]||0);
    avgKcal  += allMeals.filter(function(m){return m.date===d;})
      .reduce(function(a,m){return a+(m.kcal||(m.glucides||0)*4+(m.proteines||0)*4+(m.lipides||0)*9);},0);
    count++;
  });
  if (count > 0) { avgHydro = Math.round(avgHydro/count); avgKcal = Math.round(avgKcal/count); }

  var EMOJIS = { nat:'🏊', velo:'🚴', run:'🏃' };
  var sessHtml = prep.slice(0,4).map(function(s){
    var sp     = TS.SPORTS[s.sport]||{};
    var hrs    = s.duration ? Math.floor(s.duration) : 0;
    var mins   = s.duration ? Math.round((s.duration-hrs)*60) : 0;
    var durStr = s.duration ? (hrs?hrs+'h':'')+(mins?String(mins).padStart(2,'0'):'') : '';
    var linked = s.comp_id === c.id;
    return '<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 7px;border-radius:10px;background:'+(linked?'rgba(91,115,245,.2)':'rgba(255,255,255,.05)')+';border:1px solid '+(linked?'var(--accent)':'var(--border)')+'">'
      +(sp.emoji||'')
      +' '+s.date.slice(5)
      +(durStr?' · '+durStr:'')
      +(s.rpe?' · RPE '+s.rpe:'')
      +(linked?' <span style="color:var(--accent2);font-size:9px">lié</span>':'')
      +'</span>';
  }).join(' ');

  var nutriHtml = count > 0
    ? '<span style="font-size:11px;color:var(--text-2)">Nutrition J-7 moy. :'
      + (avgHydro ? ' 💧 '+avgHydro+'ml' : '')
      + (avgKcal  ? ' · 🍽 '+avgKcal+' kcal' : '')
      + '</span>'
    : '';

  return '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">'
    + '<div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Préparation</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px">' + sessHtml + '</div>'
    + nutriHtml
    + '</div>';
}

function renderList() {
  const today = new Date().toISOString().split('T')[0];
  let comps = TS.getCompetitions();
  if (currentFilter === 'upcoming') comps = comps.filter(c=>c.date>=today);
  else if (currentFilter === 'done') comps = comps.filter(c=>c.date<today||c.actual_time);
  else if (currentFilter === 'goal_ok') comps = comps.filter(c=>c.actual_time&&c.goal_time&&timeToSec(c.actual_time)<=timeToSec(c.goal_time));

  const el = document.getElementById('compList');
  if (!comps.length) {
    el.innerHTML = `<div class="empty"><div class="empty__icon">🏁</div><div class="empty__text">Aucune course ici</div><div class="empty__sub">Ajoutez votre première course avec le bouton ci-dessus</div></div>`;
    return;
  }

  el.innerHTML = comps.map(c => {
    const isPast    = c.date < today;
    const hasDone   = !!c.actual_time;
    const goalOk    = hasDone && c.goal_time && timeToSec(c.actual_time) <= timeToSec(c.goal_time);
    const daysLeft  = Math.ceil((new Date(c.date)-new Date())/86400000);
    const pace      = hasDone && c.distance ? calcCompPace(c) : null;
    const ecart     = hasDone && c.goal_time ? timeGap(c.actual_time, c.goal_time) : null;
    const prioColor = c.priority==='A' ? 'var(--red)' : c.priority==='B' ? 'var(--yellow)' : 'var(--text-3)';
    const typeColor = c.type==='TRI'?'--accent':c.type==='RUN'?'--run':c.type==='BIKE'?'--velo':'--nat';

    return `<div class="comp-card" style="position:relative;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:var(${typeColor})"></div>
      <div style="padding-left:8px;flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
          <span style="font-size:10px;font-weight:700;color:${prioColor};letter-spacing:.08em">${c.priority||'B'}</span>
          <span style="font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,0.06);color:var(${typeColor})">${c.type}</span>
          <span style="font-size:12px;color:var(--text-2)">${new Date(c.date+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}</span>
          ${!isPast ? `<span style="font-size:11px;color:var(--accent-light);background:rgba(99,102,241,0.12);padding:2px 8px;border-radius:20px">J-${daysLeft}</span>` : ''}
        </div>
        <div style="font-size:16px;font-weight:700;margin-bottom:4px">${c.name}</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2)">
          ${c.distance ? `<span>${c.distance} km</span>` : ''}
          ${c.goal_time ? `<span>Objectif : <b style="font-family:var(--mono)">${c.goal_time}</b></span>` : ''}
          ${hasDone ? `<span>Réalisé : <b style="font-family:var(--mono);color:${goalOk?'var(--green)':'var(--red)'}">${c.actual_time}</b></span>` : ''}
          ${pace ? `<span>Allure : <b style="font-family:var(--mono)">${pace}</b></span>` : ''}
          ${ecart ? `<span>Écart : <b style="color:${ecart.positive?'var(--green)':'var(--red)'}">${ecart.label}</b></span>` : ''}
        </div>
        ${c.notes ? `<div style="font-size:11px;color:var(--text-3);margin-top:4px;font-style:italic">${c.notes}</div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0">
        ${hasDone ? `<div style="font-size:22px">${goalOk ? '✅' : '❌'}</div>` : `<div style="font-size:22px">🔜</div>`}
        <button class="btn btn--ghost btn--sm" onclick="editComp('${c.id}')">Modifier</button>
      </div>
    </div>`;
  }).join('');
}

// ── Pace calc ─────────────────────────────────────────────────────────────────
function calcCompPace(c) {
  const secs = timeToSec(c.actual_time);
  if (!secs || !c.distance) return null;
  const h = secs/3600;
  if (c.type==='RUN') return TS.calcPace(h, c.distance, 'run');
  if (c.type==='BIKE') return TS.calcPace(h, c.distance, 'velo');
  if (c.type==='NAT') return TS.calcPace(h, c.distance, 'nat');
  return null;
}

function updateCompCalc() {
  const goal   = document.getElementById('c_goal').value;
  const actual = document.getElementById('c_actual').value;
  const dist   = parseFloat(document.getElementById('c_dist').value);
  const type   = document.getElementById('c_type').value;
  const parts  = [];
  if (goal && actual) {
    const gSec = timeToSec(goal), aSec = timeToSec(actual);
    if (gSec && aSec) {
      const diff = aSec - gSec;
      const sign = diff <= 0 ? '-' : '+';
      parts.push(`Écart : ${sign}${secToTime(Math.abs(diff))} ${diff<=0?'✅':'❌'}`);
    }
  }
  if (actual && dist) {
    const secs = timeToSec(actual);
    const h = secs/3600;
    const sport = type==='RUN'?'run':type==='BIKE'?'velo':'nat';
    const pace = TS.calcPace(h, dist, sport);
    if (pace) parts.push(`Allure/Vitesse : ${pace}`);
  }
  document.getElementById('c_calc').textContent = parts.join('  ·  ') || '';
}

// ── Time helpers ──────────────────────────────────────────────────────────────
// Format accepté : HH:MM:SS  ou  H:MM:SS  ou  MM:SS  ou  H:MM
// Règle : si 2 parties et partie[0] < 10 → HH:MM, sinon MM:SS
function timeToSec(str) {
  if (!str) return 0;
  const parts = str.trim().split(':').map(Number);
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) {
    // Heuristique : si la première partie ressemble à des heures (≤ 9 et format HH:MM attendu)
    // On considère qu'un temps de course en 2 parties est HH:MM si le premier chiffre est ≤ 9 ET la valeur totale > 60min
    // Mais pour une course RUN de 35:40 → 35 min 40 sec
    // On choisit MM:SS si parts[0] >= 10 OU si parts[0]*60 < 600 (moins de 10h)
    // Règle simple : si parts[0] >= 10 → c'est MM:SS, sinon HH:MM
    if (parts[0] >= 10) return parts[0]*60 + parts[1]; // MM:SS
    return parts[0]*3600 + parts[1]*60;                // HH:MM
  }
  return 0;
}
function secToTime(sec) {
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = Math.floor(sec%60);
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function timeGap(actual, goal) {
  const diff = timeToSec(actual) - timeToSec(goal);
  const abs  = Math.abs(diff);
  const sign = diff <= 0 ? '-' : '+';
  // Affichage : si < 60s → "±XX s", sinon "±MM:SS" ou "±H:MM:SS"
  const label = abs < 60
    ? `${sign}${abs}s`
    : `${sign}${secToTime(abs)}`;
  return { label, positive: diff <= 0 };
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openCompModal(comp=null) {
  editId = comp?.id || null;
  document.getElementById('compModalTitle').textContent = comp ? 'Modifier la course' : 'Nouvelle course';
  document.getElementById('deleteCompBtn').style.display = comp ? 'inline-flex' : 'none';
  document.getElementById('c_date').value     = comp?.date     || new Date().toISOString().split('T')[0];
  document.getElementById('c_type').value     = comp?.type     || 'TRI';
  document.getElementById('c_name').value     = comp?.name     || '';
  document.getElementById('c_dist').value     = comp?.distance || '';
  document.getElementById('c_priority').value = comp?.priority || 'A';
  document.getElementById('c_goal').value     = comp?.goal_time   || '';
  document.getElementById('c_actual').value   = comp?.actual_time || '';
  document.getElementById('c_notes').value    = comp?.notes    || '';
  document.getElementById('c_calc').textContent = '';
  document.getElementById('compModal').classList.add('open');
}

function editComp(id) {
  const c = TS.getCompetitions().find(c=>c.id===id);
  if (c) openCompModal(c);
}

function saveCompForm() {
  const comp = {
    id:          editId,
    date:        document.getElementById('c_date').value,
    type:        document.getElementById('c_type').value,
    name:        document.getElementById('c_name').value,
    distance:    parseFloat(document.getElementById('c_dist').value)||null,
    priority:    document.getElementById('c_priority').value,
    goal_time:   document.getElementById('c_goal').value   || null,
    actual_time: document.getElementById('c_actual').value || null,
    notes:       document.getElementById('c_notes').value,
  };
  if (!comp.date || !comp.name) { TS.toast('Date et nom obligatoires', 'error'); return; }
  TS.saveCompetition(comp);
  closeModal();
  // Force re-render immédiat (l'event triseason:update peut être asynchrone)
  setTimeout(renderAll, 50);
  TS.toast('Course enregistrée');
}

function deleteCurrentComp() {
  if (!editId || !confirm('Supprimer cette course ?')) return;
  TS.deleteCompetition(editId);
  closeModal();
  setTimeout(renderAll, 50);
  TS.toast('Course supprimée');
}

function closeModal() { document.getElementById('compModal').classList.remove('open'); editId = null; }
function toggleMenu() { document.getElementById('navLinks').classList.toggle('open'); }
</script>
